<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111827">
    <meta name="description" content="Meu Widget - abra seu site favorito como um aplicativo">

    <link rel="manifest" href="/static/manifest.json">

    <title>Meu Widget</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #111827;
        }

        .barra {
            height: 65px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: #1f2937;
        }

        .url {
            flex: 1;
            height: 42px;
            border: none;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 15px;
            outline: none;
        }

        button {
            height: 42px;
            padding: 0 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .pagina {
            width: 100%;
            height: calc(100% - 65px);
            border: none;
            background: white;
        }

        @media (max-width: 600px) {
            .barra {
                height: 60px;
            }

            .pagina {
                height: calc(100% - 60px);
            }

            button {
                padding: 0 12px;
            }
        }
    </style>
</head>

<body>

    <div class="barra">
        <input
            id="url"
            class="url"
            type="url"
            placeholder="Cole o link aqui..."
            value="https://www.wikipedia.org"
        >

        <button onclick="abrirSite()">Abrir</button>
    </div>

    <iframe
        id="pagina"
        class="pagina"
        src="https://www.wikipedia.org">
    </iframe>

    <script>
        function abrirSite() {
            let url = document.getElementById("url").value.trim();

            if (!url) {
                alert("Cole um link primeiro.");
                return;
            }

            if (!url.startsWith("http://") &&
                !url.startsWith("https://")) {
                url = "https://" + url;
            }

            document.getElementById("pagina").src = url;

            localStorage.setItem("meuWidgetUrl", url);
        }

        window.addEventListener("load", function() {
            const salvo = localStorage.getItem("meuWidgetUrl");

            if (salvo) {
                document.getElementById("url").value = salvo;
                document.getElementById("pagina").src = salvo;
            }
        });

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function() {
                navigator.serviceWorker.register("/static/sw.js")
                    .then(function() {
                        console.log("Service Worker ativado.");
                    })
                    .catch(function(error) {
                        console.log("Erro no Service Worker:", error);
                    });
            });
        }
    </script>

</body>
</html>
